[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "search-mcp"
version = "0.1.0"
description = "Minimal MCP web search server — DuckDuckGo & Brave, stdio"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
search-mcp = "search_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["search_mcp"]
